# The site is built and deployed by imprint's workflow, which every Semiotic
# Systems site shares.  This one says when.
name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'doc/web/**'
      - '.github/workflows/pages.yml'
      - '**.go'
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: rjbs/semiotic-imprint/.github/workflows/site.yml@main
    with:
      go: true
